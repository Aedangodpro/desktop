<!doctype html>
<html
  lang="en"
  class="antialiased"
  data-theme="dark"
  style="color-scheme: dark"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#08090b" />
    <meta name="color-scheme" content="dark light" />
    <title>Liner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Montserrat:wght@100..900&family=Roboto+Flex:GRAD,XOPQ,XTRA,YOPQ,YTAS,YTDE,YTFI,YTLC,YTUC,opsz,wdth,wght@-200..150,27..175,323..603,25..135,649..854,-305..-98,560..788,416..570,528..760,8..144,25..151,100..1000&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-inter: "Inter Variable", "Inter", sans-serif;
        --font-geist-mono: "Geist Mono", monospace;
        --font-roboto-flex: "Roboto Flex", sans-serif;
        --font-montserrat-family: "Montserrat", sans-serif;
        --shell-bg: #08090b;
        --shell-surface: #101216;
        --shell-accent: #4cc9f0;
      }

      /* The app window is the page: no document scrolling, no white flash. */
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--shell-bg);
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        color-scheme: dark;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        height: 100%;
        width: 100%;
      }

      /* Boot splash: static HTML/CSS so it paints before the JS bundle. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background:
          radial-gradient(
            920px 520px at 50% 12%,
            rgba(76, 201, 240, 0.1),
            transparent 62%
          ),
          radial-gradient(
            700px 420px at 50% 100%,
            rgba(59, 130, 246, 0.08),
            transparent 60%
          ),
          var(--shell-bg);
        transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      html[data-ready="true"] #boot-splash {
        opacity: 0;
        pointer-events: none;
      }
      .boot-mark {
        display: grid;
        justify-items: center;
        gap: 8px;
      }
      .boot-word {
        font-family: var(--font-montserrat-family);
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #f4f7fa;
        text-shadow: 0 0 28px rgba(76, 201, 240, 0.35);
      }
      .boot-tag {
        font-family: var(--font-geist-mono);
        font-size: 10.5px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.72);
      }
      .boot-bar {
        position: relative;
        width: 148px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.18);
      }
      .boot-bar span {
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          transparent,
          var(--shell-accent),
          transparent
        );
        animation: boot-sweep 1.35s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-sweep {
        from {
          transform: translateX(-120%);
        }
        to {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar span {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
        #boot-splash {
          transition: none;
        }
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body class="h-full w-full overflow-hidden">
    <div id="root" class="h-full w-full"></div>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-mark">
        <span class="boot-word">Liner</span>
        <span class="boot-tag">Browser edition</span>
      </div>
      <div class="boot-bar"><span></span></div>
      <span class="sr-only">Loading Liner…</span>
    </div>
    <script type="module" src="/src/main.web.tsx"></script>
  </body>
</html>
